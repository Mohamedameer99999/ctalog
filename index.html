<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كتالوج المنتجات | أحلى براند ستور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1420;
    --ink-2:#161F30;
    --paper:#F7F3EC;
    --gold:#F2B705;
    --green:#1E9E5A;
    --line: rgba(255,255,255,0.12);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Tajawal', sans-serif;
    background: var(--ink);
    color:#F4F1E8;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%; display:block;}

  header{
    padding: 28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:6px;
  }
  .brand img{width:46px; height:46px; border-radius:12px;}
  .brand-name{font-family:'Cairo',sans-serif; font-weight:800; font-size:1.3rem;}
  header p{color:#9A9587; font-size:0.9rem;}

  main{
    max-width:640px;
    margin:0 auto;
    padding: 28px 16px 60px;
  }

  .product-card{
    background: var(--ink-2);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:20px;
    display:flex;
    flex-direction:column;
  }
  .product-photo{
    width:100%;
    aspect-ratio: 16/10;
    overflow:hidden;
    background:#000;
  }
  .product-photo img{
    width:100%; height:100%;
    object-fit:cover;
    object-position: center 25%;
  }
  .product-body{padding:18px 20px 20px;}
  .product-name{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:1.15rem;
    margin-bottom:6px;
  }
  .product-price-row{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:16px;
  }
  .price-now{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:1.3rem;
    color:var(--gold);
  }
  .price-old{
    font-size:0.9rem;
    color:#726D5F;
    text-decoration:line-through;
  }
  .product-actions{
    display:flex;
    gap:10px;
  }
  .btn{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    font-weight:700;
    font-size:0.92rem;
    text-align:center;
    text-decoration:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition: transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-open{
    background: var(--gold);
    color: var(--ink);
  }
  .btn-copy{
    background: transparent;
    border:1px solid var(--line);
    color:#F4F1E8;
  }
  .btn-copy.copied{
    background: var(--green);
    border-color: var(--green);
    color:#fff;
  }

  .empty-note{
    text-align:center;
    color:#726D5F;
    font-size:0.9rem;
    padding:30px 20px;
    border:1px dashed var(--line);
    border-radius:14px;
  }

  footer{
    text-align:center;
    padding:24px 20px 40px;
    color:#726D5F;
    font-size:0.8rem;
  }

  @media (min-width:520px){
    .product-card{flex-direction:row;}
    .product-photo{width:38%; aspect-ratio:auto;}
    .product-body{flex:1;}
  }
</style>
</head>
